name: Release

# Publish a release by pushing a tag that matches the version in package.json:
#   1. set "version" in package.json and add a "## [x.y.z]" section to CHANGELOG.md; commit and push to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
# This workflow then checks the tag, runs the tests, builds and smoke-tests every package on Windows and
# Linux, and publishes them with SHA256SUMS.txt and signed build attestations as a GitHub Release.

on:
  push:
    tags: ['v*']

# Nothing by default; every job asks for exactly what it needs.
permissions: {}

jobs:
  verify:
    name: Check the tag and run the tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: The tag must match the version in package.json
        id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r .version package.json)"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $package_version in package.json"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      # Fail now rather than after twenty minutes of building.
      - name: CHANGELOG.md must describe this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node tools/release-notes.mjs "$VERSION" > /dev/null

      - run: npm test

  package:
    name: Build the packages
    needs: verify
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read

  publish:
    name: Publish the release
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the build attestations
      attestations: write # store the build attestations
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      # Fails unless all five packages are there and nothing else is.
      - name: Write SHA256SUMS.txt
        run: node tools/package/checksums.mjs --require-all

      - name: List what will be published
        run: ls -l dist

      # One attestation per file (checksums included) proves it was built by this repository's workflow:
      #   gh attestation verify <file> --repo <owner>/stick-note
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create the GitHub release
        run: |
          set -euo pipefail
          node tools/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Stick Note $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            "${flags[@]}"
