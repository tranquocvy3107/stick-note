name: Idea or feature request
description: Suggest something that would make Stick Note better
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Stick Note is deliberately small: **one whiteboard, and your memory of where things are.**
        Ideas that keep that spirit are very welcome. Please read the short list of principles in [CONTRIBUTING.md](https://github.com/tranquocvy3107/stick-note/blob/main/CONTRIBUTING.md) first.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: checkboxes
    id: fit
    attributes:
      label: Does it fit the idea?
      options:
        - label: It works on the one board (no new pages, folders, tags or lists).
        - label: It never moves my notes by itself.
