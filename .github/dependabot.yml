version: 2
updates:
  # Every action in .github/workflows is pinned to a commit. Dependabot proposes the newer commit
  # (and updates the "# vX.Y.Z" comment next to it) once a week, in a single pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # The Rust crates in Cargo.lock. Dependabot opens one pull request a week for the newer compatible versions;
  # the tests and the packaging smoke tests then run on it like on any change.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      rust-crates:
        patterns: ['*']
